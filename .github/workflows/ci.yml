name: ci

on:
  push:
  pull_request:

jobs:
  agent:
    name: Agent policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/requirements.txt
      - name: Run policy-gate tests
        run: PYTHONPATH=services python -m unittest discover -s services/tests -v

  ui:
    name: UI typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: ui
      - run: npm run build
        working-directory: ui

  container:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relay-agent:ci .
